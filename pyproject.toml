[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fedavg"
version = "1.0.0"
description = "Federated AI with Embedded Devices using Flower"
license = "Apache-2.0"
dependencies = [
    "flwr>=1.28.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
]

[tool.hatch.build]
exclude = [
    "datasets/*", # Exclude datasets from FAB (if generated in this directory)
    "_static/*", # Exclude images in README from FAB
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

[tool.flwr.app.components]
serverapp = "fedavg.server_app:app"
clientapp = "fedavg.client_app:app"

[tool.flwr.app.config]
# resnet: 22k params, ~100 kB/round. resattention: 3.3M params, ~13 MB/round.
model = "resnet"
num-server-rounds = 20
# 0.0 = no per-client evaluation.
fraction-evaluate = 0.0
local-epochs = 1
learning-rate = 0.05
batch-size = 8
max-train-samples = 1024
# Written by generate_dataset.py. Skipped if absent on the server node.
server-test-path = "datasets/fashionmnist_server_test"
server-eval-batch-size = 64
# 0 = off (score afterwards with evaluation.py), 1 = every round, k = every k-th.
server-eval-every = 0

# Defaults for generate_dataset.py; command-line flags override them.
[tool.dataset]
num-supernodes = 2
# iid | dirichlet | pathological
partition = "iid"
# Dirichlet skew: 0.1 extreme, 0.5 strong, 10 mild, 100+ near-IID.
alpha = 0.5
# Pathological: num-supernodes * this should be >= 10, or classes are discarded.
classes-per-partition = 2
# first-deterministic keeps client class sets disjoint; random does not.
class-assignment-mode = "first-deterministic"
# Holdout for the server node only. Never copied to a client.
server-test = true
